[package]
name = "nova-snark"
version = "0.71.0"
authors = ["Srinath Setty <srinath@microsoft.com>"]
edition = "2021"
description = "High-speed recursive arguments from folding schemes"
documentation = "https://docs.rs/nova-snark/"
readme = "README.md"
repository = "https://github.com/Microsoft/Nova"
license-file = "LICENSE"
keywords = ["zkSNARKs", "cryptography", "proofs"]
rust-version = "1.79.0"

[dependencies]
ff = { version = "0.13.0", features = ["derive"] }
digest = "0.10"
sha3 = "0.10"
rayon = "1.10"
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
rand_chacha = "0.3"
subtle = "2.6.1"
generic-array = "1.2.0"
num-bigint = { version = "0.4.6", features = ["serde", "rand"] }
num-traits = "0.2.19"
num-integer = "0.1.46"
serde = { version = "1.0.217", features = ["derive"] }
serde_with = "3.8.3"
bincode = { version = "2", features = ["serde", "std"] }
bitvec = "1.0"
blitzar = { version = "5.0.0", optional = true }
byteorder = "1.4.3"
thiserror = "2.0.11"
once_cell = "1.18.0"
itertools = "0.14.0"

# Use halo2curves ASM on x86_64 by default; disable ASM on non-x86_64
[target.'cfg(target_arch = "x86_64")'.dependencies]
halo2curves = { version = "0.9.0", features = ["std", "bits", "derive_serde", "asm"] }

[target.'cfg(not(target_arch = "x86_64"))'.dependencies]
halo2curves = { version = "0.9.0", features = ["std", "bits", "derive_serde"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.15", default-features = false, features = ["js"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
flate2 = "1.0.35"
hex = "0.4.3"
pprof2 = { version = "0.13" }
cfg-if = "1.0.0"
sha2 = "0.10.7"
proptest = "1.6.0"
rand = "0.8.5"
expect-test = "1.5.1"
reqwest = { version = "0.12", features = ["blocking"] }
serde_json = "1.0"

[[bench]]
name = "recursive-snark"
harness = false

[[bench]]
name = "compressed-snark"
harness = false

[[bench]]
name = "sha256"
harness = false

[[bench]]
name = "ppsnark"
harness = false

[[bench]]
name = "commit"
harness = false

[[bench]]
name = "sumcheckeq"
harness = false

[[example]]
name = "ptau_test_setup"
required-features = ["test-utils", "io"]

[[example]]
name = "ppot_prune"
required-features = ["io"]

[features]
default = ["io"]
flamegraph = ["pprof2/flamegraph", "pprof2/criterion"]
experimental = []
# C1-β lookup-fold extension: NeutronNova NIFS extended with a per-step
# Lasso-style lookup-zero-fold (LogUp, paper precedent: eprint 2023/1216 v3
# §3 / 2022/1530). Pinned by ADR-0023 + the soundness sketch addendum
# `docs/research/cryptography/c1-beta-lookup-fold-soundness-sketch-addendum-spike-design-pins.md`.
# Implies `experimental` because it lives entirely inside the `neutron` module.
lookup-fold = ["experimental"]
evm = []
io = []
# Enables insecure setup methods that generate random tau. Only for testing!
test-utils = []
# C1-β GH-#5 M.GH5.7 (Pin Corrigendum #10 Q2 ruling, Halpert 2026-05-10):
# opt-in feature flag exposing test-only corruption knobs on the augmented-
# circuit's input builder for the negative-test triple in
# `crates/inumbra-spend-harness/tests/m_gh5_7_negative_test_triple.rs`.
#
# Vendor `#[cfg(test)]` gates do NOT activate when the consumer crate is
# inumbra-spend-harness (out-of-crate); this feature flag's
# `#[cfg(any(test, feature = "test-debug-knobs"))]` gating allows
# inumbra-spend-harness `[dev-dependencies]` to enable the knob without
# polluting the production build surface.
#
# Audit-firm packet documents this feature flag's test-only contract per
# Corrigendum #10 Q2 ruling. The `corrupt_t_lookup_at_index` field on
# `NeutronAugmentedCircuitInputs` is the only knob this gate exposes;
# enabling the feature in production is incorrect (no production callsite
# constructs `NeutronAugmentedCircuitInputs` with the knob set).
test-debug-knobs = []
